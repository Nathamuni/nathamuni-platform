# ─────────────────────────────────────────────────────────────────────────────
# TIER 2 — DISCOVERY. Find registries; do not depend on them.
# ─────────────────────────────────────────────────────────────────────────────

- id: registry-directory
  tier: discovery
  url: https://registry.directory/
  inspect: sort by Popular / Stars / Recently active
  lesson: 70+ registries indexed. No public API — browsing only, so it feeds curation, not automation. Some entries are Sponsored or Premium-only; check before wiring a namespace.
  cost: free
  last_verified: 2026-08-05
  fetch_status: verified
  used_in: []

- id: awesome-shadcn-registries
  tier: discovery
  url: https://www.shadcn.io/awesome/registries
  inspect: which registries support the shadcn CLI directly
  lesson: CLI-compatible registries only. If it is not installable via namespace, it is a reference, not a dependency.
  cost: free
  last_verified: 2026-08-05
  fetch_status: verified
  used_in: []

- id: 21st-dev
  tier: discovery
  url: https://21st.dev
  specific: https://help.21st.dev/magic-chat/pricing
  inspect: how it packages search + preview + install + publish in one loop
  lesson: The product model worth copying — discovery and source code in one place, agent-readable. The workflow is the lesson, not the catalogue.
  do_not_copy: not usable as a pipeline. Free tier is 2 component installs/day and 100 credits/month, then $20/mo. Fails a free-first requirement.
  cost: freemium
  last_verified: 2026-08-05
  fetch_status: verified
  used_in: []

