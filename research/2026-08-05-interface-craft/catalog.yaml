- id: noomo
  tier: reference
  url: https://noomoagency.com/
  specific: TODO — pick one case study, not the homepage
  inspect: how narrative order drives page structure; how technical capability is communicated without a feature list
  lesson: >
    Story determines medium, not the reverse. Narrative sequence IS the page architecture:
    opening proposition, tension, reveal, evidence, exploration, resolution, action.
    Motion carries the story or it is decoration.
  do_not_copy: typography, copy, navigation, branded assets, any specific case-study composition. Never imply affiliation.
  cost: free
  last_verified: null
  fetch_status: unverified
  used_in: []

