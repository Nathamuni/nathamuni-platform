# interface-craft reference catalogue
#
# RULES OF USE
#   1. Query 3-5 records per task, never the whole file. Loading all of it produces
#      the same fashionable dark/WebGL answer for every brief.
#   2. This file is a routing index, not a substitute for research. Live search is
#      always allowed and often better.
#   3. If a fetch fails, say the fetch failed. Never summarise a page you did not read.
#      Set `fetch_status: dead` and move on.
#   4. `tier: reference` records are for principles only. Never pull code, assets,
#      copy, or compositions from them.
#   5. A record with `last_verified: null` has not been checked by anything. Treat it
#      as a lead, not a source.
#
# SCHEMA
#   tier          registry | discovery | reference
#   url           entry point
#   specific      a concrete project/page worth reading, not the homepage. TODO = unfilled.
#   inspect       what to actually look at when you get there
#   lesson        the transferable principle
#   do_not_copy   what is off-limits
#   cost          free | freemium | paid
#   last_verified ISO date, set only by something that actually fetched it
#   fetch_status  verified | unverified | dead
#   used_in       projects where this record actually changed a decision. Empty = candidate for deletion.

# ─────────────────────────────────────────────────────────────────────────────
