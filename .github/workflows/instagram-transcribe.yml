name: Instagram Transcribe

# Turns what is said in each reel into text (lib/transcripts.json) with Gemini, on GitHub's runner.
# Called by instagram-sync.yml after the daily sync; also runnable by hand with a small limit.
# Up to `limit` reels per run, newest first. Gemini's free tier is small (~20 requests/day per
# project), so the ~240 past reels backfill over ~2 weeks; a daily-quota stop is not a failure.

on:
  workflow_call:
    inputs:
      limit:
        type: number
        default: 15
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max reels to transcribe this run'
        type: number
        default: 3

permissions:
  contents: write

concurrency:
  group: instagram-transcribe
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sites/nathamuni-com
    env:
      TRANSCRIBE_MODEL: gemini-3.5-flash
      WORK: /tmp/reels
    steps:
      - name: Checkout latest main (includes this morning's sync)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Fetch audio for reels without a transcript
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TRANSCRIBE_LIMIT: ${{ inputs.limit }}
        run: node scripts/ig-transcribe.mjs prep "$WORK"

      - name: Transcribe with Gemini
        timeout-minutes: 40
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/ig-transcribe-gemini.mjs "$WORK"

      - name: Save transcripts
        if: ${{ !cancelled() }}
        run: node scripts/ig-transcribe.mjs merge "$WORK"

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- lib/transcripts.json && git ls-files --error-unmatch lib/transcripts.json >/dev/null 2>&1; then
            echo "No new transcripts."
            exit 0
          fi
          git config user.name "instagram-sync[bot]"
          git config user.email "actions@github.com"
          git add lib/transcripts.json
          git commit -m "FEAT: transcribe reels"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 10
          done
          exit 1
